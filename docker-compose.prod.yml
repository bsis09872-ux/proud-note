# 운영(EC2) 배포용
#   Supabase 사용(기본): docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#   DB 도 같이 띄우기:   위 명령에 --profile local-db 추가 + DATABASE_URL 호스트를 db 로
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env.prod
    environment:
      MEDIA_DIR: /app/media
    ports:
      - "80:8000"
    volumes:
      - media:/app/media # 업로드한 이모지 이미지 보존

  db:
    profiles: ["local-db"]
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proud}
      POSTGRES_DB: ${POSTGRES_DB:-proud_note}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    # DB 포트는 외부에 열지 않는다

volumes:
  pgdata:
  media:
